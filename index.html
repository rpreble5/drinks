<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>November Back Bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
/* Layout: a bare fall menu. A shuffle button and spirit filter on top, then the drinks. Warm oat paper, espresso ink, pumpkin accent; each drink keeps its own tinted badge, pills and recipe panel. */
:root {
  --bg: #f8ecdc;
  --surface: #fff8ee;
  --fg: #2e1a10;
  --muted: #7a5a45;
  --line: #e6d0b4;
  --accent: #b5471b;
  --accent-ink: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 80px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 40rem; margin: 0 auto; }

.head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.filter { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; min-width: 0; max-width: 100%; }
.filter::-webkit-scrollbar { display: none; }
.filter button { flex: none; white-space: nowrap; border: 0; border-bottom: 2px solid transparent; background: none; padding: 0; min-height: 36px; font-size: .92rem; color: var(--muted); }
.filter button[aria-pressed="true"] { border-bottom-color: var(--accent); color: var(--fg); font-weight: 600; }
.shuffle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; min-height: 44px; padding: 0 18px 0 12px; font-weight: 600; }
.shuffle .i { width: 22px; height: 22px; transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
.shuffle:hover .i, .shuffle:active .i { transform: rotate(200deg); }


ul.menu { list-style: none; margin: 14px 0 0; padding: 0; }
.sect { margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sect:first-child { margin-top: 8px; }
.drink { padding: 18px 0; border-bottom: 1px dashed var(--line); }
.row { display: flex; gap: 16px; align-items: flex-start; }
.gl { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--surface); background: color-mix(in srgb, var(--c) 24%, var(--bg)); }
.gi { position: relative; display: inline-flex; width: 38px; height: 38px; transform-origin: 50% 85%; transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.gi svg.i { width: 38px; height: 38px; }
.drink.open .gi { transform: rotate(-12deg); }
.bub { position: absolute; bottom: 8px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; pointer-events: none; }
.bub:nth-child(2) { left: 16px; }
.bub:nth-child(3) { left: 20.5px; }
.bub:nth-child(4) { left: 18.5px; }
.drink.open .bub { animation: rise 1.6s ease-in infinite; }
.drink.open .bub:nth-child(3) { animation-delay: .5s; }
.drink.open .bub:nth-child(4) { animation-delay: 1s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-14px); opacity: 0; } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-18deg); } 60% { transform: rotate(14deg); } }
.drink.pop .gi { animation: wiggle .6s ease; }

.toggle { flex: 1; min-width: 0; display: block; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.name { display: block; font: 700 1.2rem/1.2 var(--display); letter-spacing: -.01em; }
.name .i { display: inline-block; vertical-align: -2px; margin-left: 6px; width: 18px; height: 18px; color: var(--accent); transition: transform .2s; }
.toggle[aria-expanded="true"] .name .i { transform: rotate(180deg); }
.taste { display: block; font-size: .95rem; margin-top: 3px; }
.iwrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
.drink.open .iwrap { grid-template-rows: 0fr; }
.iclip { display: block; overflow: hidden; min-height: 0; }
.ings { display: block; color: var(--muted); font-size: .85rem; padding-top: 6px; transition: opacity .2s ease; }
.drink.open .ings { opacity: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 10px; font-size: .85rem; color: var(--muted); }
.stat { white-space: nowrap; }
.stat b { color: var(--fg); font-weight: 600; }
.stat.mod { color: var(--accent); font-weight: 600; }

.dwrap { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .3s ease, visibility 0s linear .3s; }
.drink.open .dwrap { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .3s ease, visibility 0s; }
.dclip { overflow: hidden; min-height: 0; }
.detail { margin-top: 14px; padding: 16px; border-radius: 16px; display: grid; gap: 16px; background: var(--surface); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.spec div { opacity: 0; transform: translateY(-6px); transition: opacity .2s ease, transform .2s ease; }
.drink.open .spec div { opacity: 1; transform: none; transition-delay: calc(var(--k, 0) * 45ms + 90ms); }
.opts, .how { opacity: 0; transition: opacity .25s ease; }
.drink.open .opts, .drink.open .how { opacity: 1; transition-delay: .25s; }
dl.spec { margin: 0; display: grid; gap: 6px; font-size: .95rem; }
dl.spec div { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px dotted var(--muted); padding-bottom: 5px; }
dl.spec dt { min-width: 0; }
dl.spec dd { margin: 0; color: var(--muted); white-space: nowrap; font-weight: 500; text-align: right; }
dl.spec dt { flex: 1; }
dl.spec .hint { margin-left: 6px; font-size: .78rem; font-weight: 400; opacity: .75; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ol { font-size: .82rem; color: var(--muted); width: 5.5rem; }
.seg { display: flex; gap: 18px; flex-wrap: wrap; }
.seg button { border: 0; border-bottom: 2px solid transparent; background: none; border-radius: 0; min-height: 38px; padding: 0; font-size: .92rem; color: var(--muted); }
.seg button[aria-pressed="true"] { border-bottom-color: var(--accent); color: var(--fg); font-weight: 600; }
.how { margin: 0; font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .name .i, .dwrap, .drink.open .dwrap, .iwrap, .ings, .spec div, .opts, .how, .gi, .shuffle .i { transition: none !important; }
  .drink.open .bub, .drink.pop .gi { animation: none; }
  .drink.open .gi { transform: none; }
}
</style>
</head>

  function lengthened(d) { return mods(d.id).str === "light" && d.method === "shaken" && hasAlcohol(d); }
  function calc(d) {
    var m = mods(d.id), vol = 0, top = 0, eth = 0, items = [];
    var ing = lengthened(d) ? d.ing.concat([I("Soda water", SODA, "top")]) : d.ing;
    ing.forEach(function (i) {
      var a = i.a;
      if (i.u === "oz") {
        if (m.str === "light" && (d.method === "stirred" || isBase(d, i))) a *= 0.5;
      }
      if (i.sw) a *= m.sw === "less" ? 0.5 : m.sw === "more" ? 1.5 : 1;
      var v = (i.u === "oz" || i.u === "top") ? a : (UV[i.u] || 0) * a;
      if (i.u === "top") top += v; else vol += v;
      eth += v * i.abv;
      items.push({ n: i.n, a: a, u: i.u });
    });
    var total = vol * DIL[d.method] + top;
    return { items: items, oz: total, std: eth / 0.6, abv: total ? eth / total * 100 : 0 };
  }
  function stdText(x) { return x < 0.05 ? "0" : x.toFixed(1); }
  function modText(m) {
    var p = [];
    if (m.str === "light") p.push("light");
    if (m.sw === "less") p.push("less sweet"); else if (m.sw === "more") p.push("sweeter");
    return p;
  }

  function icon(id) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function glassHTML(d) {
    var bubbles = isFizzy(d) ? '<i class="bub"></i><i class="bub"></i><i class="bub"></i>' : "";
    return '<span class="gl"><span class="gi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="--liq:' + d.color + '"><use href="#g-' + d.glass + '"/></svg>' + bubbles + '</span></span>';
  }
  function ingText(d) {
    return d.ing.map(function (i, k) { return k === 0 || PROPER.test(i.n) ? i.n : i.n.charAt(0).toLowerCase() + i.n.slice(1); }).join(", ");
  }
  function segHTML(d, k, label, opts) {
    var cur = mods(d.id)[k];
    return '<div class="opt"><span class="ol">' + label + '</span><div class="seg" role="group" aria-label="' + label + ' for ' + esc(d.name) + '">' +
      opts.map(function (o) {
        return '<button data-act="mod" data-id="' + d.id + '" data-k="' + k + '" data-v="' + o[0] + '" data-key="mod-' + d.id + '-' + k + '-' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>';
      }).join("") + '</div></div>';
  }
  function howText(d) {
    var t = [], top = d.ing.filter(function (i) { return i.u === "top"; })[0];
    if (d.ing.some(function (i) { return i.u === "rim"; })) t.push("Rim the glass with " + d.ing.filter(function (i) { return i.u === "rim"; })[0].n.toLowerCase() + ".");
    if (d.method === "stirred") t.push((d.glass === "coupe" ? "Stir with ice, then strain into a chilled coupe." : "Stir with ice, then strain over a large ice cube.") + (mods(d.id).str === "light" ? " Half pour." : ""));
    else if (lengthened(d)) t.push("Shake with ice, strain into a tall glass over fresh ice, then top with soda water.");
    else if (d.method === "shaken") t.push(d.glass === "coupe" ? "Shake with ice, then strain into a chilled coupe." : d.glass === "tall" ? "Shake with ice, then strain into a tall glass over fresh ice." : "Shake with ice, then strain over fresh ice.");
    else t.push(top ? "Build over ice, then top with " + top.n.toLowerCase() + " and stir gently." : "Build over ice.");
    if (d.garnish) t.push("Garnish with " + d.garnish + ".");
    if (d.tip) t.push(d.tip);
    return t.join(" ");
  }
  function detailHTML(d, c) {
    var spec = '<dl class="spec">' + c.items.map(function (i, k) { return '<div style="--k:' + k + '"><dt>' + esc(i.n) + '</dt><dd>' + amountText(i) + spoonHint(i) + '</dd></div>'; }).join("") + '</dl>';
    var opts = "";
    if (hasAlcohol(d)) opts += segHTML(d, "str", "Strength", [["reg", "Regular"], ["light", "Light"]]);
    if (hasSweet(d)) opts += segHTML(d, "sw", "Sweetness", [["less", "Less"], ["reg", "Regular"], ["more", "More"]]);
    var how = '<p class="how">' + howText(d) + '</p>';
    return '<div class="dwrap"><div class="dclip"><div class="detail" id="p-' + d.id + '">' + spec + (opts ? '<div class="opts">' + opts + '</div>' : "") + how + '</div></div></div>';
  }
  function statsHTML(d, c) {
    var s = '<span class="stat"><b>' + c.oz.toFixed(1) + '</b> oz drink</span>';
    s += hasAlcohol(d) ? '<span class="stat"><b>' + Math.round(c.abv) + '%</b> alcohol</span><span class="stat"><b>' + stdText(c.std) + '</b> standard drinks</span>' : '<span class="stat">No alcohol</span>';
    modText(mods(d.id)).forEach(function (t) { s += '<span class="stat mod">' + esc(t) + '</span>'; });
    return '<span class="stats">' + s + '</span>';
  }
  // Keeps the chevron on the same line as the last word of the name.
  function nameHTML(n) {
    var k = n.lastIndexOf(" ");
    return esc(n.slice(0, k + 1)) + '<span style="white-space:nowrap">' + esc(n.slice(k + 1)) + icon("i-chev") + '</span>';
  }
  function drinkHTML(d) {
    var open = !!state.open[d.id], c = calc(d);
    return '<li class="drink' + (open ? " open" : "") + '" data-drink="' + d.id + '" style="--c:' + d.color + '"><div class="row">' + glassHTML(d) +
      '<button class="toggle" data-act="toggle" data-id="' + d.id + '" data-key="toggle-' + d.id + '" aria-expanded="' + open + '" aria-controls="p-' + d.id + '">' +
        '<span class="name">' + nameHTML(d.name) + '</span>' +
        '<span class="taste">' + esc(d.taste) + '</span>' +
        '<span class="iwrap"><span class="iclip"><span class="ings">' + esc(ingText(d)) + '</span></span></span>' +
        statsHTML(d, c) +
      '</button></div>' + detailHTML(d, c) + '</li>';
  }

  function shown() {
    if (state.base === "All") return DRINKS;
    if (state.base === "Montenegro") return DRINKS.filter(function (d) { return d.ing.some(function (i) { return i.n === "Amaro Montenegro"; }); });
    return DRINKS.filter(function (d) { return d.base === state.base; });
  }
  function renderFilter() {
    $("filter").innerHTML = BASES.map(function (b) {
      return '<button data-act="base" data-v="' + b + '" data-key="base-' + b + '" aria-pressed="' + (state.base === b) + '">' + b + '</button>';
    }).join("");
  }
  function renderMenu() {
    var html = "";
    if (state.base === "All") {
      var picks = PICKS.map(function (id) { return DRINKS.filter(function (d) { return d.id === id; })[0]; });
      html += '<li class="sect" role="presentation">Recommended</li>';
      picks.forEach(function (d) { html += drinkHTML(d); });
      html += '<li class="sect" role="presentation">Everything else</li>';
      DRINKS.forEach(function (d) { if (PICKS.indexOf(d.id) < 0) html += drinkHTML(d); });
    } else {
      shown().forEach(function (d) { html += drinkHTML(d); });
    }
    $("menu").innerHTML = html;
    restoreFocus();
  }
  function restoreFocus() {
    if (!focusKey) return;
    var el = document.querySelector('[data-key="' + focusKey + '"]');
    focusKey = null;
    if (el) el.focus();
  }
  function surprise() {
    var list = shown(), pool = list.filter(function (d) { return d.id !== lastPick; });
    if (!pool.length) pool = list;
    if (!pool.length) return;
    var d = pool[Math.floor(Math.random() * pool.length)];
    lastPick = d.id;
    state.open = {};
    renderMenu();
    var li = document.querySelector('[data-drink="' + d.id + '"]');
    if (!li) return;
    var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    li.scrollIntoView({ block: "center", behavior: rm ? "auto" : "smooth" });
    li.classList.add("pop");
    setTimeout(function () {
      state.open[d.id] = true;
      li.classList.add("open");
      var b = li.querySelector(".toggle");
      b.setAttribute("aria-expanded", "true");
      b.focus({ preventScroll: true });
    }, rm ? 0 : 450);
    setTimeout(function () { li.classList.remove("pop"); }, 1100);
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id"), v = t.getAttribute("data-v");
    if (act === "toggle") {
      state.open[id] = !state.open[id];
      t.setAttribute("aria-expanded", String(state.open[id]));
      t.closest(".drink").classList.toggle("open", state.open[id]);
    }
    else if (act === "mod") {
      focusKey = t.getAttribute("data-key");
      var m = state.mods[id] || (state.mods[id] = {});
      m[t.getAttribute("data-k")] = v;
      save(); renderMenu();
    }
    else if (act === "base") {
      focusKey = t.getAttribute("data-key");
      state.base = v; state.open = {};
      renderFilter(); renderMenu();
    }
    else if (act === "surprise") { surprise(); }
  });

  load();
  renderFilter();
  renderMenu();
})();
</script>
</body>
</html>
